<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf5ea" />
    <meta name="description" content="沸点火锅点单与门店履约概念演示，非官方产品" />
    <title>沸点 · 火锅点单概念演示</title>
    <script>
      (function () {
        // 同步设置初始语言到 html lang 属性
        try {
          var lang = localStorage.getItem('i18nextLng');
          document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-CN';
        } catch (e) {
          // localStorage 不可用时保持默认中文
        }
      })();
      (function () {
        // 挂载前初始化主题（夜间模式）与 theme-color，避免刷新出现浅色闪烁
        // key 与取值口径需与 src/hooks/useTheme.ts 保持一致
        var dark = false;
        try {
          dark = localStorage.getItem('theme') === 'dark';
        } catch (e) {
          // localStorage 不可用时保持默认浅色
        }
        if (dark) {
          document.documentElement.classList.add('dark');
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', '#211f1c');
        }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
